name: Flutter CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build and Test Flutter App
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK)
      # Android builds require JDK 17 (or compatible version)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Caches pub packages

      # Step 4: Install Dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 5: Run Static Analysis (Linter)
      - name: Analyze Project Code
        run: flutter analyze

      # Step 6: Run Unit Tests (if any)
      - name: Run Tests
        run: flutter test

      # Step 7: Build Android APK
      - name: Build Android APK (Debug & Release)
        run: |
          flutter build apk --debug
          flutter build apk --release

      # Step 8: Build Android App Bundle (AAB)
      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      # Step 9: Upload Artifacts
      # This saves the generated APK and AAB files as build artifacts on GitHub
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
